services:
  www:
    image: tjalagania/usermanager-www:v1
    container_name: $WWW_CONTANER_NAME
    environment:
      SERVER_NAME: $SERVER_NAME
      APP_NAME: $APP_NAME
    
    ports:
      - "80:80"
    depends_on:
      - back
      - db
  back:
    image: tjalagania/usermanager-back:v1
    container_name: $APP_NAME
    environment:
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: $POSTGRES_DB
        POSTGRES_SERVER_NAME: $POSTGRES_SERVER_NAME
   
    ports:
      - 5000:5000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres
    container_name: $POSTGRES_SERVER_NAME
    environment:
       POSTGRES_USER: $POSTGRES_USER
       POSTGRES_PASSWORD: $POSTGRES_PASSWORD
       POSTGRES_DB: $POSTGRES_DB
       PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    
    #ports:
    #  - "5432:5432"

  

volumes:
  db-data:
