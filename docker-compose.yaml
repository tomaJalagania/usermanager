services:
  www:
    image: tjalagania/usermanager-www:v1
    container_name: $WWW_NAME
    environment:
      WWW_NAME: $WWW_NAME
      APP_NAME: $APP_NAME
    
    ports:
      - "80:80"
    depends_on:
      - back
      - db
  back:
    image: tjalagania/usermanager-back:v1
    container_name: $APP_NAME
    environment:
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: $POSTGRES_DB
        POSTGRES_SERVER_NAME: $POSTGRES_SERVER_NAME
   
    ports:
      - 5000:5000
    #depends_on:
    #  - db
  db:
    image: postgres
    container_name: $POSTGRES_SERVER_NAME
    environment:
       POSTGRES_USER: $POSTGRES_USER
       POSTGRES_PASSWORD: $POSTGRES_PASSWORD
       POSTGRES_DB: $POSTGRES_DB
       PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    
    #ports:
    #  - "5432:5432"

  

volumes:
  db-data:
