services:
  db:
    image: postgres
    environment:
       POSTGRES_PASSWORD: 111111
       POSTGRES_USER: user
       POSTGRES_DB: users
       PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"

  

volumes:
  db-data: